<!DOCTYPE html>
<html>
<head>
    <title>Birthday Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }

        h2 {
            color: #ff4081;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #e91e63;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🎂 login pannu da 🎂</h2>
    <input type="text" id="name" placeholder="Enter Name"><br>
    <input type="password" id="password" placeholder="Enter Password"><br>
    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    var name = document.getElementById("vempuli").value;
    var password = document.getElementById("17032009").value;

    if(password === "17032009") {
        localStorage.setItem("birthdayName", name);
        window.location.href = "birthday.html";
    } else {
        alert("Wrong Password!");
    }
}
</script>

</body>
</html>
